# โปรไฟล์สำหรับเทสต์ — ใช้ H2 ในหน่วยความจำ เทสต์จึงรันได้โดยไม่ต้องมี PostgreSQL
spring.datasource.url=jdbc:h2:mem:smartsell-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=TEST_ONLY_SECRET_KEY_THAT_IS_LONG_ENOUGH_FOR_HS256_SIGNING
app.jwt.expiration-ms=3600000

app.auth.invite-code=TEST_INVITE_CODE

# ไม่เรียก Gemini จริงระหว่างเทสต์
app.ai.gemini-api-key=test-key

# ให้มี JavaMailSender bean แต่ไม่มีการส่งเมลจริงระหว่างเทสต์
spring.mail.host=localhost
